name: Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - 'server/home-monitoring-server/**'
      - 'deploy/java-server/**'
      - 'deploy/docker-compose.yml'
      - '.github/workflows/deploy-server.yml'

concurrency:
  group: home-monitoring-deploy
  cancel-in-progress: false

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Build backend
        working-directory: server/home-monitoring-server
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar --no-daemon

      - name: Prepare SSH
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$LIGHTSAIL_HOST" || (echo "LIGHTSAIL_HOST secret is empty" && exit 1)
          test -n "$LIGHTSAIL_SSH_KEY" || (echo "LIGHTSAIL_SSH_KEY secret is empty" && exit 1)

          install -m 700 -d ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem

          ssh-keygen -y -f ~/.ssh/lightsail.pem > /dev/null
          ssh-keyscan -T 30 -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote server directory
        run: |
          ssh -i ~/.ssh/lightsail.pem \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_DIR }}/java-server' && \
             rm -f '${{ secrets.DEPLOY_DIR }}/java-server/'*.jar"

      - name: Upload backend files
        run: |
          scp -i ~/.ssh/lightsail.pem deploy/docker-compose.yml \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:${{ secrets.DEPLOY_DIR }}/docker-compose.yml"

          scp -i ~/.ssh/lightsail.pem deploy/java-server/Dockerfile \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:${{ secrets.DEPLOY_DIR }}/java-server/Dockerfile"

          JAR_FILE="$(find server/home-monitoring-server/build/libs -name '*.jar' ! -name '*plain*' | head -n 1)"
          scp -i ~/.ssh/lightsail.pem "$JAR_FILE" \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:${{ secrets.DEPLOY_DIR }}/java-server/app.jar"

      - name: Deploy backend with Docker Compose
        run: |
          ssh -i ~/.ssh/lightsail.pem \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" <<'EOF'
          set -euo pipefail

          docker network inspect home-monitoring >/dev/null 2>&1 || docker network create home-monitoring

          cd '${{ secrets.DEPLOY_DIR }}'
          test -f .env || (echo "Missing ${PWD}/.env" && exit 1)

          docker compose up -d postgres

          for i in $(seq 1 30); do
            STATUS="$(docker inspect -f '{{.State.Health.Status}}' home_postgres 2>/dev/null || true)"
            if [ "$STATUS" = "healthy" ]; then
              break
            fi
            echo "Waiting for postgres healthcheck... current status: ${STATUS:-unknown}"
            sleep 2
          done

          STATUS="$(docker inspect -f '{{.State.Health.Status}}' home_postgres)"
          test "$STATUS" = "healthy" || (echo "postgres is not healthy: $STATUS" && docker logs home_postgres && exit 1)

          docker compose up -d --build java-server
          docker image prune -f
          EOF
