name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'deploy/vue-web/**'
      - 'deploy/docker-compose.yml'
      - '.github/workflows/deploy-web.yml'

concurrency:
  group: home-monitoring-deploy
  cancel-in-progress: false

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Prepare SSH
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$LIGHTSAIL_HOST" || (echo "LIGHTSAIL_HOST secret is empty" && exit 1)
          test -n "$LIGHTSAIL_SSH_KEY" || (echo "LIGHTSAIL_SSH_KEY secret is empty" && exit 1)

          install -m 700 -d ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem

          ssh-keygen -y -f ~/.ssh/lightsail.pem > /dev/null
          ssh-keyscan -T 30 -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote web directory
        run: |
          ssh -i ~/.ssh/lightsail.pem \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_DIR }}/vue-web' && \
             rm -rf '${{ secrets.DEPLOY_DIR }}/vue-web/dist'"

      - name: Upload frontend files
        run: |
          scp -i ~/.ssh/lightsail.pem deploy/docker-compose.yml \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:${{ secrets.DEPLOY_DIR }}/docker-compose.yml"

          scp -i ~/.ssh/lightsail.pem deploy/vue-web/Dockerfile deploy/vue-web/nginx.conf \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:${{ secrets.DEPLOY_DIR }}/vue-web/"

          scp -i ~/.ssh/lightsail.pem -r web/dist \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:${{ secrets.DEPLOY_DIR }}/vue-web/dist"

      - name: Deploy frontend with Docker Compose
        run: |
          ssh -i ~/.ssh/lightsail.pem \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            "docker network inspect home-monitoring >/dev/null 2>&1 || docker network create home-monitoring && \
             cd '${{ secrets.DEPLOY_DIR }}' && \
             docker compose up -d --build --no-deps vue-web && \
             docker image prune -f"
