services:
  postgres:
    image: postgres:15
    container_name: home_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - home-monitoring
    restart: always

  java-server:
    build:
      context: ./java-server
      dockerfile: Dockerfile
    container_name: home_java
    environment:
      SERVER_PORT: 80
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    expose:
      - "80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - home-monitoring
    restart: always

  vue-web:
    build:
      context: ./vue-web
      dockerfile: Dockerfile
    container_name: home_web
    ports:
      - "80:80"
    depends_on:
      - java-server
    networks:
      - home-monitoring
    restart: always

volumes:
  pgdata:

networks:
  home-monitoring:
    external: true
